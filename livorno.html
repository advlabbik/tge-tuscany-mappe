  if(k[0]%10===0) k10.addLayer(m); if(k[0]%50===0) k50.addLayer(L.marker([k[1],k[2]],{icon:L.divIcon({className:'km',html:'<span>km '+k[0]+'</span>',iconSize:[0,0]}),interactive:false})); k1.addLayer(L.marker([k[1],k[2]],{icon:L.divIcon({className:'km',html:'<span>km '+k[0]+'</span>',iconSize:[0,0]}),interactive:false}));
  if(k[3]!==null) arr.addLayer(L.marker([k[4],k[5]],{icon:L.divIcon({className:'ar',html:'<div style="transform:rotate('+k[3]+'deg)"></div>',iconSize:[0,0]}),interactive:false}));
});
function upd(){var z=map.getZoom();
  map.removeLayer(k1);map.removeLayer(k10);map.removeLayer(k50);map.addLayer(z>=13?k1:(z>=9.5?k10:k50));
  if(z>=12)map.addLayer(arr);else map.removeLayer(arr);}
map.on('zoomend',upd);
var full=L.latLngBounds(T);
function pad(){var m=innerWidth<=520;var h=document.getElementById('box').offsetHeight;return m?{paddingTopLeft:[20,20],paddingBottomRight:[20,h+40]}:{paddingTopLeft:[20,h+30],paddingBottomRight:[20,20]}}
function comuni(){map.fitBounds(hi.getBounds(),pad())}
document.getElementById('b1').onclick=comuni;
document.getElementById('b2').onclick=function(){map.fitBounds(full,pad())};
comuni();upd();
</script>
